name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check . --select=E4,E7,E9,F,W

      - name: Byte-compile sources
        run: python -m compileall -q src app.py init_db.py